[package]
name = "reviewv4"
version = "0.1.0"
description = "AI Code Reviewer — Vim-first desktop reviewer for AI-generated code"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reviewv4_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# Only the clock: the export names its file after the reviewer's local day, and
# `std` has no calendar to turn a timestamp into one.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[features]
# `app` carries every dependency that needs the system webview (WebKitGTK dev
# headers on Linux). The git / review / export layers are pure and testable
# without it: `cargo test --no-default-features`.
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-clipboard-manager"]
